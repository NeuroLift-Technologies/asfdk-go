name: ASFDK Go Governance Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check governance status
        run: |
          bash .nltotoi/scripts/validate-governance.sh
      - name: gofmt check
        run: |
          test -z "$(gofmt -l .)" || { echo 'gofmt violations:'; gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./... -count=1 -v